<style>
@font-face{font-family:"Source Serif 4";font-weight:400;font-display:swap;src:url(fonts/source-serif-4-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}

*{box-sizing:border-box;margin:0;padding:0}
:root{--sb:#12263C;--hd:#FFCB05;--tx:#E7F0F9;--mu:#94AEC6;--ln:#314257;--cd:#1B3350;--hb:#FFCB05;--hf:#12263C;--fh:"Source Serif 4",Georgia,serif}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{background:var(--sb);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--hd);outline-offset:3px;border-radius:6px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hd{position:sticky;top:0;z-index:5;background:var(--sb);border-bottom:1px solid var(--ln)}
.nav{max-width:960px;margin:0 auto;padding:14px clamp(20px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:inline-flex}
.logo img{height:30px;width:auto}
.lk{display:flex;align-items:center;gap:10px}
.tile{font-size:14px;font-weight:600;padding:8px 18px;border:1.5px solid transparent;border-radius:99px;color:var(--mu);transition:background .15s,color .15s}
.tile:hover{color:var(--hd)}
.tile[aria-current=page]{background:var(--hb);color:var(--hf)}
.lg{font-size:13px;font-weight:500;color:var(--mu);margin-left:10px;white-space:nowrap}
.lg button{font:inherit;color:inherit;background:none;border:0;padding:2px;cursor:pointer}
.lg button[aria-pressed=true],.lg button:hover{color:var(--hd)}

.wrap{max-width:960px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.view{display:block}
#v-home{padding:clamp(72px,12vw,128px) 0 clamp(64px,9vw,104px)}
#v-projects,#v-fun{border-top:1px solid var(--ln);padding:clamp(56px,8vw,96px) 0}
#v-fun{padding-bottom:clamp(80px,10vw,128px)}
.who{font-family:var(--fh);font-weight:600;font-size:30px;line-height:1.1;color:var(--hd)}
.rl{margin-top:14px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.t1{margin-top:28px;font-family:var(--fh);font-weight:600;font-size:clamp(34px,5.2vw,56px);line-height:1.08;letter-spacing:-.015em;color:var(--hd);max-width:780px}
.st{font-family:var(--fh);font-weight:600;font-size:clamp(30px,4vw,40px);line-height:1.1;color:var(--hd)}
.sm{margin-top:16px;font-size:17px;line-height:1.7;max-width:600px}
.t1+.sm{margin-top:32px}
.hl{margin-top:40px;font-family:var(--fh);font-weight:600;font-size:22px;line-height:1.35;color:var(--hd);max-width:600px}
.ct{margin-top:56px;font-family:var(--fh);font-weight:600;font-size:22px;line-height:1.2;color:var(--hd)}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;max-width:720px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:112px;padding:16px;border:1px solid var(--ln);border-radius:8px;font-weight:500;font-size:15px;color:var(--tx);transition:background .15s,color .15s,border-color .15s}
.card svg.i{font-size:24px}
.card:hover,.pill:hover{background:var(--hb);border-color:var(--hb);color:var(--hf)}

.pj{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:40px}
.st+.sm+.pj{margin-top:40px}
.pc{background:var(--cd);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px}
.pc.soon{background:transparent;border:1.5px dashed var(--hd)}
.chip{align-self:flex-start;font-size:12px;font-weight:600;border:1.5px solid var(--hd);border-radius:99px;padding:1px 10px;color:var(--hd)}
.tt{font-family:var(--fh);font-weight:600;font-size:21px;line-height:1.25;color:var(--hd)}
.d{font-size:15px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1.5px solid var(--hd);border-radius:99px;font-weight:600;font-size:14px;color:var(--hd);transition:background .15s,color .15s,border-color .15s;margin-top:8px;align-self:flex-start}

.bb{display:none}

/* Móvil: una vista a la vez, barra inferior */
@media(max-width:640px){
  html{scroll-behavior:auto}
  body{padding-bottom:96px}
  .hd{position:static;border-bottom:0}
  .nav{padding:20px 18px 0}
  .logo img{height:26px}
  .lk .tile{display:none}
  .lg{margin-left:0}
  .wrap{padding:0 18px}
  .view{display:none}
  .view.on{display:block}
  #v-home.on{display:flex;flex-direction:column}
  #v-home>*{order:6}
  #v-home .who{order:1}#v-home .rl{order:2}#v-home .t1{order:3}#v-home .ct{order:4;margin-top:24px}#v-home .g3{order:5}
  #v-home{padding:36px 0 24px}
  #v-projects,#v-fun{border-top:0;padding:36px 0 24px}
  .who{font-size:24px}
  .rl{margin-top:10px;font-size:12px}
  .t1{margin-top:20px;font-size:30px}
  .st{font-size:30px}
  .sm{font-size:16px;margin-top:14px}
  .t1+.sm{margin-top:14px}
  #v-home .sm:first-of-type,#v-home .g3+.sm{margin-top:28px}
  .hl{font-size:20px;margin-top:32px}
  .ct{margin-top:28px;font-size:20px}
  .g3{gap:8px;margin-top:10px}
  .card{min-height:88px;padding:12px 8px;font-size:13px;gap:8px}
  .card svg.i{font-size:22px}
  .pj{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:24px}
  .pc,.pc.soon{border-radius:20px;padding:18px}
  .card:active,.pill:active{background:var(--hb);color:var(--hf)}
  .bb{display:flex;justify-content:space-around;background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:6px;position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .bb a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:500;color:var(--mu);padding:6px 12px;border-radius:99px;min-width:76px}
  .bb a svg{font-size:20px}
  .bb a[aria-current=page]{background:var(--hb);color:var(--hf)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></symbol>

</svg>

<header class="hd">
  <div class="nav">
    <a href="#/" class="logo" data-route-link="home" aria-label="Home"><img src="img/logo.png" alt="IHC" width="48" height="30"></a>
    <nav class="lk" aria-label="Main">

      <span class="lg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button> | <button type="button" data-lang="es" aria-pressed="false">ES</button></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <main>
    <section class="view" id="v-home" data-view="home">
      <p class="who">Ignacio Hernández</p>
      <p class="rl">Operations Manager · Madrid</p>
      <h1 class="t1" data-t="h1">I turn complex, unstructured operations into systems that work.</h1>
      <p class="sm" data-t="p1"></p>

        <a class="card" id="c-mail" href="#" target="_blank" rel="noopener"><svg class="i"><use href="#i-mail"/></svg><span>Email</span></a>

<nav class="bb" aria-label="Main">
  <a href="#/" data-route="home"><svg class="i"><use href="#i-home"/></svg><span data-t="home">Home</span></a>
  <a href="#/projects" data-route="projects"><svg class="i"><use href="#i-rocket"/></svg><span data-t="projects">Projects</span></a>
  <a href="#/fun" data-route="fun"><svg class="i"><use href="#i-game"/></svg><span data-t="fun">Fun stuff</span></a>
</nav>

<script>
(function(){
  // === EDITA ESTO: tu email, partido en dos para no dejarlo en claro en el HTML ===
  var MAIL_USER = 'ignaciohc23';          // parte antes de la @
  var MAIL_HOST = 'gmail.com';           // parte después de la @

  var T = {
    en:{home:'Home',projects:'Projects',fun:'Fun stuff',
      title:'Ignacio Hernández · Operations Manager',
      h1:'I turn complex, unstructured operations into systems that work.',
      p1:'I\'ve run operations in startups and through a merger, managed partner programs and onboarding at Microsoft, and restructured a family agribusiness remotely.',
      p1b:'What I like most is finding where a process falls short: too slow, too manual, full of errors or not digital yet. Then I redesign it and choose the systems and tools that make it work, from projects to onboardings to support flows.',
      p2:'Lately I\'m doing all of this with AI, and I\'m starting to apply it to small and medium businesses. If you have a process that needs fixing, let\'s talk.',
      ct:'Contact',
      hl:'Before putting weeks or budget into an idea, I build a rough version with AI and see if it holds.',
      c1:'In construction',m1:'Used-car marketplace for Venezuela',d1:'A modern marketplace for used cars: vehicle information, price history and inspections by verified workshops. Starting in Maracaibo.',
      c2:'Idea · Coming soon',m2:'AI consulting',d2:'Helps small and medium businesses optimize and automate their processes, and choose the best tools for their workflows.',
      fsub:'Small things I build for fun.',q:'Venezuelan Capitals Quiz',qd:'Guess the capital of every Venezuelan state. Solo or two players, two difficulty levels. (In Spanish)',play:'Play'},
    es:{home:'Inicio',projects:'Proyectos',fun:'Fun stuff',
      title:'Ignacio Hernández · Operations Manager',
      h1:'Convierto operaciones complejas y desestructuradas en sistemas que funcionan.',
      p1:'He llevado operaciones en startups y durante una fusión, gestionado programas de partners y onboarding en Microsoft, y reestructurado en remoto una empresa agropecuaria familiar.',
      p1b:'Lo que más me gusta es encontrar dónde falla un proceso: demasiado lento, demasiado manual, con muchos errores o todavía sin digitalizar. Después lo rediseño y elijo los sistemas y herramientas que lo hacen funcionar, desde proyectos hasta onboardings y flujos de soporte.',
      p2:'Últimamente hago todo esto con IA, y estoy empezando a aplicarlo a pequeñas y medianas empresas. Si tienes un proceso que arreglar, hablemos.',
      ct:'Contacto',
      hl:'Antes de invertir semanas o presupuesto en una idea, construyo una versión básica con IA y compruebo si se sostiene.',
      c1:'En construcción',m1:'Marketplace de coches usados para Venezuela',d1:'Un marketplace moderno de coches usados: información del vehículo, historial de precios e inspecciones en talleres verificados. Empezando en Maracaibo.',
      c2:'Idea · Próximamente',m2:'Consultoría IA',d2:'Ayuda a pequeñas y medianas empresas a optimizar y automatizar sus procesos y a elegir las mejores herramientas para sus flujos de trabajo.',
      fsub:'Pequeñas cosas que construyo por diversión.',q:'Quiz de capitales de Venezuela',qd:'Adivina la capital de cada estado de Venezuela. Solo o en pareja, con dos niveles de dificultad.',play:'Jugar'}
  };

  var lang = 'en';
  try{ var s = localStorage.getItem('lang'); if(s==='es'||s==='en') lang = s; }catch(e){}

  var mq = window.matchMedia('(max-width:640px)');
  var active = 'home';

  function hashRoute(){
    var h = (location.hash||'').replace(/^#\/?/,'');
    return (h==='projects'||h==='fun') ? h : 'home';
  }

  function setActive(r){
    active = r;
    document.querySelectorAll('[data-route]').forEach(function(a){
      if(a.getAttribute('data-route')===r) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.getAttribute('data-view')===r); });
  }

  function render(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang')===lang)); });
    document.getElementById('c-cv').setAttribute('href','cv/Ignacio_Hernandez_CV_'+lang.toUpperCase()+'.pdf');
  }

  // Escritorio: una sola página con scroll; móvil: una vista a la vez
  function goTo(r){
    if(mq.matches){ setActive(r); window.scrollTo(0,0); return; }
    var el = document.getElementById(r==='home' ? 'v-home' : 'v-'+r);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    setActive(r);
  }

  function spy(){
    if(mq.matches) return;
    var p = document.getElementById('v-projects').getBoundingClientRect().top;
    var f = document.getElementById('v-fun').getBoundingClientRect().top;
    var line = window.innerHeight*0.4;
    var atEnd = (window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 4;
    var r = (f <= line || atEnd) ? 'fun' : (p <= line ? 'projects' : 'home');
    if(r !== active) setActive(r);
  }

  document.querySelectorAll('a[data-route], a[data-route-link]').forEach(function(a){
    a.addEventListener('click', function(e){
      var r = a.getAttribute('data-route') || a.getAttribute('data-route-link');
      e.preventDefault();
      try{ history.replaceState(null,'', r==='home' ? location.pathname : '#/'+r); }catch(_){}
      goTo(r);
    });
  });

  // Email: abre Gmail con el destinatario, sin escribir la dirección en el HTML
  document.getElementById('c-mail').addEventListener('click', function(e){
    e.preventDefault();
    var to = MAIL_USER + '@' + MAIL_HOST;
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to), '_blank', 'noopener');
  });

  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.getAttribute('data-lang');
      try{ localStorage.setItem('lang', lang); }catch(e){}
      render();
    });
  });

  window.addEventListener('scroll', spy, {passive:true});
  window.addEventListener('hashchange', function(){ goTo(hashRoute()); });
  (mq.addEventListener ? mq.addEventListener('change', function(){ setActive(mq.matches ? hashRoute() : active); spy(); }) : null);

  render();
  var first = hashRoute();
  setActive(first);
  if(!mq.matches && first!=='home'){ setTimeout(function(){ goTo(first); }, 50); } else { spy(); }
})();
</script>
