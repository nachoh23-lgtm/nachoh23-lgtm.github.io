@font-face{font-family:"Source Serif 4";font-weight:400;font-display:swap;src:url(fonts/source-serif-4-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}

*{box-sizing:border-box;margin:0;padding:0}
:root{--sb:#12263C;--hd:#FFCB05;--tx:#E7F0F9;--mu:#94AEC6;--ln:#314257;--cd:#1B3350;--hb:#FFCB05;--hf:#12263C;--fh:"Source Serif 4",Georgia,serif}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{background:var(--sb);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--hd);outline-offset:3px;border-radius:6px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hd{position:sticky;top:0;z-index:5;background:var(--sb);border-bottom:1px solid var(--ln)}
.nav{max-width:960px;margin:0 auto;padding:14px clamp(20px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:inline-flex}
.logo img{height:30px;width:auto}
.lk{display:flex;align-items:center;gap:10px}
.tile{font-size:14px;font-weight:500;padding:8px 4px;margin:0 10px;border-bottom:2px solid transparent;color:var(--mu);transition:color .15s,border-color .15s}
.tile:hover{color:var(--hd)}
.tile[aria-current=page]{color:var(--hd);border-bottom-color:var(--hd)}
.lg{font-size:14px;font-weight:500;color:var(--mu);margin-left:10px;white-space:nowrap}
.lg button{font:inherit;color:inherit;background:none;border:0;padding:2px;cursor:pointer}
.lg button[aria-pressed=true],.lg button:hover{color:var(--hd)}

.wrap{max-width:960px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
.view{display:block}
#v-home{padding:clamp(72px,12vw,128px) 0 clamp(64px,9vw,104px)}
#v-projects,#v-fun{padding:clamp(56px,8vw,96px) 0}
#v-fun{padding-bottom:clamp(56px,7vw,80px)}
.who{font-family:var(--fh);font-weight:600;font-size:22px;line-height:1.1;color:var(--tx)}
.upd{margin-top:8px;font-size:14px;color:var(--mu)}
.t1{margin-top:32px;font-family:var(--fh);font-weight:600;font-size:22px;line-height:1.35;letter-spacing:-.01em;color:var(--hd);max-width:780px}
.st{font-family:var(--fh);font-weight:600;font-size:clamp(30px,4vw,40px);line-height:1.1;color:var(--tx)}
.sm{margin-top:16px;font-size:17px;line-height:1.7;max-width:600px}
#v-home .sm{font-size:16px;margin-top:16px}
#v-home .t1+.sm{margin-top:14px}
#v-home .sm.p1{margin-top:18px}
#v-home .sm.p3{font-style:italic}
.lb{margin:26px 0 0;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.fx .fi{position:relative;margin-top:16px}
.fx .fi:first-child{margin-top:12px}
#v-home .fi .sm{margin-top:0}
.nd{position:absolute;left:-30px;top:3px;width:22px;height:22px;overflow:visible}
.cn{position:absolute;left:-30px;top:20px;bottom:-26px;width:22px}
.cn svg{display:block;width:100%;height:100%;overflow:visible}
.dr{fill:none;stroke:var(--mu);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease-out}
.cn .dr{stroke-opacity:.7;vector-effect:non-scaling-stroke;stroke-dasharray:none;stroke-dashoffset:0;transition:none}.cn{clip-path:inset(0 0 100% 0);transition:clip-path .9s ease-out}.fx.in .cn{clip-path:inset(0 0 -4px 0)}
.fx.in .dr{stroke-dashoffset:0}.cn{clip-path:none}
.cbtn{font:inherit;font-size:14px;font-weight:500;color:var(--hd);background:none;border:1.5px solid var(--hd);border-radius:99px;padding:7px 16px;cursor:pointer;transition:background .15s,color .15s}
.cbtn:hover{background:var(--hb);color:var(--hf)}
.cl{margin:28px 0 0;font-size:16px;font-weight:600;line-height:1.7}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px;max-width:720px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:112px;padding:16px;border:1px solid var(--ln);border-radius:8px;font-weight:500;font-size:15px;color:var(--tx);transition:background .15s,color .15s,border-color .15s}
.card svg.i{font-size:24px}
.card:hover,.pill:hover{background:var(--hb);border-color:var(--hb);color:var(--hf)}

.pj{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:40px}
.st+.sm+.pj{margin-top:40px}
.pc{background:var(--cd);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px}
.pc.soon{background:transparent;border:1.5px dashed var(--hd)}
.chip{align-self:flex-start;font-size:12px;font-weight:600;border:1.5px solid var(--hd);border-radius:99px;padding:1px 10px;color:var(--hd)}
.tt{font-family:var(--fh);font-weight:600;font-size:21px;line-height:1.25;color:var(--hd)}
.d{font-size:15px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1.5px solid var(--hd);border-radius:99px;font-weight:600;font-size:14px;color:var(--hd);transition:background .15s,color .15s,border-color .15s;margin-top:8px;align-self:flex-start}

#v-gastos{display:none;padding:clamp(56px,8vw,96px) 0 clamp(56px,7vw,80px)}
body[data-view=gastos] .view{display:none}
body[data-view=gastos] #v-gastos{display:block}
.bk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mu);margin-bottom:20px}
.bk:hover{color:var(--hd)}
#v-gastos .sm{margin-top:16px;font-size:17px;max-width:600px}
#v-gastos .sm.gn{margin-top:10px;font-size:14px;color:var(--mu)}
.dl{display:flex;flex-direction:column;gap:12px;margin-top:36px;max-width:720px}
.dr2{background:var(--cd);border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.dr2 div{display:flex;flex-direction:column;gap:4px}
.dr2 .pill{margin-top:0;flex-shrink:0}
.ft{display:flex;align-items:center;padding:0 0 48px;color:var(--mu);font-size:14px}
.ft svg{flex:none}
.f{transform-origin:18px 15px;animation:br 4s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.bl{transform-origin:18px 14px;animation:bk 4.5s infinite}
@keyframes bk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.lk{animation:lk 6s ease-in-out infinite}
@keyframes lk{0%,30%,100%{transform:translateX(0)}40%,60%{transform:translateX(1.4px)}70%,85%{transform:translateX(-1.4px)}}
.z{font:500 7px Inter,sans-serif;fill:#94AEC6;opacity:0;animation:zz 3.2s ease-in infinite}
.z2{font-size:9px;animation-delay:1.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}25%{opacity:.9}100%{opacity:0;transform:translate(4px,-6px)}}

.bb{display:none}

/* Móvil: una vista a la vez, barra inferior */
@media(max-width:640px){
  html{scroll-behavior:auto}
  body{padding-bottom:96px}
  .hd{position:static;border-bottom:0}
  .nav{padding:20px 22px 0}
  .logo img{height:38px}
  .lk .tile{display:none}
  .lg{margin-left:0}
  .lk{gap:10px}
  .wrap{padding:0 22px}
  .view{display:none}
  .view.on{display:block}
  #v-home{padding:36px 0 24px}
  #v-projects,#v-fun{padding:36px 0 24px}
  body[data-view=gastos] #v-gastos{padding:36px 0 24px}
  .bk{margin-bottom:8px}
  #v-gastos .sm{font-size:16px;margin-top:14px}
  #v-gastos .sm.gn{font-size:14px;margin-top:10px}
  .dl{margin-top:24px}
  .dr2{flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border-radius:20px}
  .who{font-size:20px}
  .upd{margin-top:6px;font-size:13px}
  .t1{margin-top:26px;font-size:18px;line-height:1.4}
  .st{font-size:30px}
  .sm{font-size:16px;margin-top:14px}
  #v-home .sm{font-size:15px;line-height:1.65;margin-top:14px}
  #v-home .t1+.sm{margin-top:12px}
  #v-home .sm.p1{margin-top:14px}
  .lb{margin-top:20px}
  .fx .fi{margin-top:14px}
  .fx .fi:first-child{margin-top:10px}
  .nd{left:-19px;top:4px;width:16px;height:16px}
  .cn{left:-19px;top:17px;bottom:-23px;width:16px}
  .cbtn{padding:6px 14px}
  .cl{margin-top:20px;font-size:15px}
  .g3{gap:8px;margin-top:12px}
  .card{min-height:88px;padding:12px 8px;font-size:13px;gap:8px}
  .card svg.i{font-size:22px}
  .pj{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:24px}
  .pc,.pc.soon{border-radius:20px;padding:18px}
  .card:active,.pill:active{background:var(--hb);color:var(--hf)}
  .bb{display:flex;gap:4px;background:rgba(27,51,80,.10);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);border:1px solid rgba(231,240,249,.13);border-radius:99px;padding:5px;position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.13)}
  .bb a{text-shadow:0 1px 8px rgba(8,20,34,.7);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:500;color:var(--tx);padding:6px 8px;border-radius:99px;min-height:48px}
  .ft{margin-top:4px}
  body:not([data-view=home]) .ft{display:none}
  .bb a svg{font-size:20px}
  .bb a[aria-current=page]{background:var(--hb);color:var(--hf);text-shadow:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.f,.bl,.lk,.z{animation:none!important}.z{opacity:.8}.dr{stroke-dashoffset:0}.cn{clip-path:none}html{scroll-behavior:auto}}
</style>
</head>

  <a href="#/" data-route="home"><svg class="i"><use href="#i-home"/></svg><span data-t="home">Home</span></a>
  <a href="#/projects" data-route="projects"><svg class="i"><use href="#i-rocket"/></svg><span data-t="projects">Projects</span></a>
  <a href="#/fun" data-route="fun"><svg class="i"><use href="#i-game"/></svg><span data-t="fun">Fun stuff</span></a>
</nav>

<script>
(function(){
  // === EDITA ESTO: tu email, partido en dos para no dejarlo en claro en el HTML ===
  var MAIL_USER = 'ignaciohc23';          // parte antes de la @
  var MAIL_HOST = 'gmail.com';           // parte después de la @

  var T = {
    en:{home:'Home',projects:'Projects',fun:'Fun stuff',
    title:'Ignacio Hernández',
     h1:'I turn complex, unstructured operations into systems that work.',
     p1:'I\'ve led operations at startups, including post-merger integration, managed a partner program and onboarding at Microsoft, and driven the remote restructuring of a family-owned agricultural business.',
     p1b:'I enjoy finding where processes break down and redesigning them with the right systems and tools. I now use AI to document, prototype and automate solutions.',
     p2:'I want to help small and medium-sized businesses improve their operations, starting with the problems that matter most.',
     p3:'Before investing time or money in an idea, I prefer to build a basic version and test it.',
     ct:'Contact',lb2:'How I work',born:'I was born in Maracaibo and have been living in Madrid since 2015.',upd:'Updated Nov 26, 2026',cl:'You can find me or reach me here.',
     c1:'In construction',m1:'Used-car marketplace for Venezuela',d1:'A modern marketplace for used cars: vehicle information, price history and inspections by verified workshops.',
     c2:'Idea · Coming soon',m2:'AI consulting',d2:'Helps small and medium businesses optimize and automate their processes, and choose the best tools for their workflows.',
     psub:'Past, current and upcoming projects.',fsub:'Small things I build for fun.',q:'Venezuelan Capitals Quiz',qd:'Guess the capital of every Venezuelan state. Solo or two players, two difficulty levels. (In Spanish)',play:'Play',g:'Expense control template',gd:'Log expenses from your iPhone in seconds. A Google Sheets template with automatic summaries and charts. (Guide in Spanish)',dl:'Download',gp:'Log expenses from your iPhone in a few seconds, without opening Google Sheets. You tap a shortcut and the sheet does the rest: totals by category, monthly savings and charts.',gn:'Most of the setup is easier on a computer; only the iPhone shortcut, at the end, is done on your phone. Download the guide and the script, and open the Sheets template right from here (the link is also in the PDF guide).',b1:'Google Sheets template',b1d:'Read-only: make your own copy with File > Make a copy.',b1b:'Open',b2:'Setup guide (PDF · Spanish)',b2d:'Step by step, with screenshots.',b3:'Apps Script (.txt)',b3d:'Open it, copy everything and paste it into Apps Script, as the guide explains.',gback:'Fun stuff'},
    es:{home:'Inicio',projects:'Proyectos',fun:'Fun stuff',
    title:'Ignacio Hernández',
     h1:'Convierto operaciones complejas en sistemas que funcionan.',
     p1:'He liderado operaciones en startups, incluida la integración tras una fusión. También gestioné un programa de partners y onboarding en Microsoft, e impulsé en remoto la reestructuración de una empresa agropecuaria familiar.',
     p1b:'Me gusta encontrar dónde falla un proceso y rediseñarlo con los sistemas y herramientas adecuados. Ahora utilizo la IA para documentar, prototipar y automatizar soluciones.',
     p2:'Quiero ayudar a pequeñas y medianas empresas a mejorar sus operaciones, empezando por los problemas que más impacto tienen.',
     p3:'Antes de invertir tiempo o dinero en una idea, prefiero construir una versión básica y ponerla a prueba.',
     ct:'Contacto',lb2:'Cómo trabajo',born:'Nací en Maracaibo y vivo en Madrid desde 2015.',upd:'Actualizado el 26 nov 2026',cl:'Encuéntrame o escríbeme aquí.',
     c1:'En construcción',m1:'Marketplace de coches usados para Venezuela',d1:'Un marketplace moderno de coches usados: información del vehículo, historial de precios e inspecciones en talleres verificados.',
     c2:'Idea · Próximamente',m2:'Consultoría IA',d2:'Ayuda a pequeñas y medianas empresas a optimizar y automatizar sus procesos y a elegir las mejores herramientas para sus flujos de trabajo.',
     psub:'Proyectos pasados, actuales y futuros.',fsub:'Pequeñas cosas que construyo por diversión.',q:'Quiz de capitales de Venezuela',qd:'Adivina la capital de cada estado de Venezuela. Solo o en pareja, con dos niveles de dificultad.',play:'Jugar',g:'Plantilla de control de gastos',gd:'Registra gastos desde el iPhone en segundos. Plantilla de Google Sheets con resúmenes y gráficos automáticos.',dl:'Descargar',gp:'Registra gastos desde el iPhone en unos segundos, sin abrir Google Sheets. Tú tocas un atajo y la hoja hace el resto: sumas por categoría, ahorro del mes y gráficos.',gn:'Casi toda la configuración es más fácil desde un ordenador; solo el atajo del iPhone, al final, se hace desde el móvil. Descarga la guía y el script, y abre la plantilla de Sheets directamente desde aquí (el enlace también está en la guía en PDF).',b1:'Plantilla de Google Sheets',b1d:'Es de solo lectura: haz tu copia con Archivo > Hacer una copia.',b1b:'Abrir',b2:'Guía de configuración (PDF)',b2d:'Paso a paso, con capturas.',b3:'Script de Apps Script (.txt)',b3d:'Ábrelo, copia todo y pégalo en Apps Script, como explica la guía.',gback:'Fun stuff'}
  };

  var lang = 'en';
  try{ var s = localStorage.getItem('lang'); if(s==='es'||s==='en') lang = s; }catch(e){}

  var mq = window.matchMedia('(max-width:640px)');
  var active = 'home';

  function hashRoute(){
    var h = (location.hash||'').replace(/^#\/?/,'');
    return (h==='projects'||h==='fun'||h==='gastos') ? h : 'home';
  }

  function setActive(r){
    active = r;
    document.body.setAttribute('data-view', r);
    var cur = r==='gastos' ? 'fun' : r;
    document.querySelectorAll('[data-route]').forEach(function(a){
      if(a.getAttribute('data-route')===cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.getAttribute('data-view')===r); });
  }

  function render(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang')===lang)); });
    document.getElementById('c-cv').setAttribute('href','cv/Ignacio_Hernandez_CV_'+lang.toUpperCase()+'.pdf');
    clock();
  }


  function clock(){
    var pp = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',hour:'numeric',minute:'2-digit',hour12:false}).formatToParts(new Date());
    var h = (+pp.filter(function(p){return p.type==='hour'})[0].value)%24, m = pp.filter(function(p){return p.type==='minute'})[0].value;
    var night = h>=23 || h<8, h12 = h%12||12, ap = h<12?'am':'pm';
    document.getElementById('ck-t').textContent = lang==='es' ? h12+':'+m+' '+ap+' en Madrid, España' : h12+':'+m+ap+' in Madrid, Spain';
    document.getElementById('ck-n').style.display = night ? 'block' : 'none';
    document.getElementById('ck-d').style.display = night ? 'none' : 'block';
  }

  // Escritorio: una sola página con scroll; móvil: una vista a la vez
  function goTo(r){
    var fromG = active==='gastos';
    if(mq.matches || r==='gastos'){ setActive(r); window.scrollTo(0,0); return; }
    setActive(r);
    var el = document.getElementById(r==='home' ? 'v-home' : 'v-'+r);
    if(el) el.scrollIntoView({behavior: fromG ? 'auto' : 'smooth', block:'start'});
  }

  function spy(){
    if(mq.matches || active==='gastos') return;
    var p = document.getElementById('v-projects').getBoundingClientRect().top;
    var f = document.getElementById('v-fun').getBoundingClientRect().top;
    var line = window.innerHeight*0.4;
    var atEnd = (window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 4;
    var r = (f <= line || atEnd) ? 'fun' : (p <= line ? 'projects' : 'home');
    if(r !== active) setActive(r);
  }

  document.querySelectorAll('a[data-route], a[data-route-link]').forEach(function(a){
    a.addEventListener('click', function(e){
      var r = a.getAttribute('data-route') || a.getAttribute('data-route-link');
      e.preventDefault();
      try{ history.replaceState(null,'', r==='home' ? location.pathname : '#/'+r); }catch(_){}
      goTo(r);
    });
  });

  document.getElementById('cbtn').addEventListener('click', function(){
    if(mq.matches){ setActive('home'); try{ history.replaceState(null,'',location.pathname); }catch(_){} }
    setTimeout(function(){ document.getElementById('contact').scrollIntoView({behavior:mq.matches?'auto':'smooth', block:'start'}); }, mq.matches?30:0);
  });

  // Email: abre Gmail con el destinatario, sin escribir la dirección en el HTML
  document.getElementById('c-mail').addEventListener('click', function(e){
    e.preventDefault();
    var to = MAIL_USER + '@' + MAIL_HOST;
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to), '_blank', 'noopener');
  });

  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.getAttribute('data-lang');
      try{ localStorage.setItem('lang', lang); }catch(e){}
      render();
    });
  });

  window.addEventListener('scroll', spy, {passive:true});
  window.addEventListener('hashchange', function(){ goTo(hashRoute()); });
  (mq.addEventListener ? mq.addEventListener('change', function(){ setActive(mq.matches ? hashRoute() : active); spy(); }) : null);

  (function(){
    var fx = document.querySelector('.fx');
    if(!fx) return;
    if(!('IntersectionObserver' in window)){ fx.classList.add('in'); return; }
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ fx.classList.add('in'); io.disconnect(); } }); }, {threshold:0.25});
    io.observe(fx);
  })();

  render();
  setInterval(clock, 30000);
  var first = hashRoute();
  setActive(first);
  if(!mq.matches && first!=='home'){ setTimeout(function(){ goTo(first); }, 50); } else { spy(); }
})();
</script>
</body>
